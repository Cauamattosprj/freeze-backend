spring.application.name=freeze
spring.devtools.remote.restart.enabled=true

# Auth cookies (httpOnly; Secure is mandatory when SameSite=None)
app.cookie.secure=true
app.cookie.same-site=None
app.cookie.path=/

# CORS - exact frontend origins (no wildcard). Comma-separated list.
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000